name: Test JitPack

# Checks that a released version can be used from JitPack: a minimal Gradle consumer project (jitpack-test/) declares
# a dependency on it, resolves it including its transitive dependencies, and runs code from it.
# JitPack builds a version on its first request, which can take a while, so the check is retried.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (tag or commit) to test; defaults to the latest release'
        required: false

permissions:
  contents: read

env:
  MAX_ATTEMPTS: 10
  RETRY_DELAY_SECONDS: 60

jobs:
  jitpack:
    name: Test JitPack
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Never cache resolution results of this check, a version JitPack has not built yet must not be remembered as missing
          cache-disabled: true

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG:-$INPUT_VERSION}"
          if [ -z "$version" ]; then
            version=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "Testing neon-util version $version from JitPack"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve and run neon-util from JitPack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Attempt $attempt of $MAX_ATTEMPTS"
            echo "JitPack build status:"
            curl -s "https://jitpack.io/api/builds/com.github.NeonMika/neon-util/$VERSION" || true
            echo
            if ./gradlew -p jitpack-test run -PneonUtilVersion="$VERSION" --refresh-dependencies; then
              echo "::endgroup::"
              echo "neon-util $VERSION is available on JitPack and works."
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "neon-util $VERSION not usable from JitPack yet, retrying in $RETRY_DELAY_SECONDS seconds..."
              sleep "$RETRY_DELAY_SECONDS"
            fi
          done
          echo "::error::neon-util $VERSION could not be used from JitPack after $MAX_ATTEMPTS attempts. Build log: https://jitpack.io/com/github/NeonMika/neon-util/$VERSION/build.log"
          exit 1
